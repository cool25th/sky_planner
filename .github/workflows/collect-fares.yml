name: Collect fares

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: production-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: "beta"
      DATA_BACKEND: "firestore"
      SERVICE_REQUIRE_FIRESTORE: "true"
      SERVICE_REQUIRE_POSTGRES: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      FIRESTORE_MAX_DAILY_WRITES: "12000"
      FIRESTORE_MAX_DAILY_READS: "30000"
      FIRESTORE_MAX_STORAGE_MB: "600"
      SOURCE_MAX_STALE_HOURS: "24"
      SOURCE_SKYSCANNER_ENABLED: "true"
      SOURCE_KOREAN_AIR_ENABLED: "true"
      SOURCE_ASIANA_ENABLED: "true"
      SOURCE_TRAVELPAYOUTS_AVIASALES_ENABLED: "true"
      SOURCE_GOOGLE_FLIGHTS_ENABLED: "false"
      SOURCE_KAYAK_ENABLED: "false"
      SOURCE_PROMO_PAGES_ENABLED: "false"
      COLLECTOR_SOURCE_MANIFEST_JSON: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON }}
      VERCEL_REVALIDATE_SECRET: ${{ secrets.VERCEL_REVALIDATE_SECRET }}
      PARTNER_FEED_API_KEY: ${{ secrets.PARTNER_FEED_API_KEY }}
      TRAVELPAYOUTS_API_KEY: ${{ secrets.TRAVELPAYOUTS_API_KEY }}
      SKYSCANNER_FEED_API_KEY: ${{ secrets.SKYSCANNER_FEED_API_KEY }}
      KOREAN_AIR_FEED_API_KEY: ${{ secrets.KOREAN_AIR_FEED_API_KEY }}
      ASIANA_FEED_API_KEY: ${{ secrets.ASIANA_FEED_API_KEY }}
      OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
      OPS_READINESS_TOKEN: ${{ secrets.OPS_READINESS_TOKEN }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      MOCK_DATA_ENABLED: "false"
      READY: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON != '' }}
    steps:
      # DATA-20260818-003 DEFERRED 기간: manifest 없으면 깔끔히 skip(daily-batch 패턴) — 매일 실패 알림 노이즈 방지.
      - name: Skip until collector secrets are configured
        if: ${{ env.READY != 'true' }}
        run: echo "collector manifest not configured yet — skipping collect-fares (stopgap freshness handled by daily-batch)"

      - uses: actions/checkout@v4
        if: ${{ env.READY == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ env.READY == 'true' }}
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
        if: ${{ env.READY == 'true' }}

      # 자문 체크: 실패해도 수집은 계속되지만 ::warning:: 으로 반드시 표면화(하드 gate 는 audit:service-launch).
      - name: Preflight Firebase & Quota Check
        if: ${{ env.READY == 'true' }}
        run: |
          npm run preflight:firebase-env || echo "::warning::preflight:firebase-env failed — Firebase env/quota 설정을 확인하세요"
          npm run audit:firestore-quota || echo "::warning::audit:firestore-quota failed — Firestore quota 사용량을 확인하세요"

      - name: Publish Daily Firestore Batch with Quota Guard
        if: ${{ env.READY == 'true' }}
        run: |
          npm run collector:firestore -- --input tests/fixtures/collector-batch.sample.json --dry-run || echo "::warning::collector:firestore dry-run failed — Firestore publish 계약을 확인하세요"

      - name: Run service launch audit
        if: ${{ env.READY == 'true' }}
        run: >
          npm run audit:service-launch --
          --manifest-env COLLECTOR_SOURCE_MANIFEST_JSON
          --verify-release-gates
          --run-collector
          --continue-on-failure
          --output-dir runtime/service-launch-audits

      - name: Free Tier Beta Release Gate Audit
        if: ${{ env.READY == 'true' }}
        run: |
          npm run audit:free-tier-beta || echo "::warning::audit:free-tier-beta failed — free tier 한도 초과 여부를 확인하세요"

      - name: Upload collector artifacts
        if: ${{ always() && env.READY == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: collector-artifacts
          path: runtime/collector-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload service launch audit evidence
        if: ${{ always() && env.READY == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: service-launch-audit
          path: runtime/service-launch-audits
          if-no-files-found: error
          retention-days: 90
