name: Synthetic check

# 완료정의[3]/H7 역할 분리:
#   - 합성 체크(이 워크플로) = "방문자가 지금 가짜/빈 화면을 보는가" — 6시간 주기 사용자 높이 관측.
#     last_good은 정상 완화 경로(성공), demo/unavailable/unreachable/딜 0만 실패.
#   - 배치 전멸 감지(26분급 공백) = daily-batch.yml의 실패 알림 몫이다 — 주기를 줄여 분을 태우지 않는다.
# UX-20260910-007: 제품 수치(지도 도시 수·offers dedup·주간 픽) 축 추가 + 측정 결과를
# batch_state 'synthetic_check' 하트비트로 기록(launch-gate 관측 증거). 실패 시에만
# OPS_ALERT_WEBHOOK_URL로 1회 핑(URL 없으면 조용히 스킵).
on:
  schedule:
    - cron: "37 */6 * * *" # 6시간마다(무료 분 한도 내 ~20초/회)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
      DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 하트비트 기록에만 pg 필요 — 전체 의존성 설치를 피해 최소 설치한다(수 초).
      - name: Install pg for heartbeat write
        run: npm install --no-save pg
      # 스크립트가 관측+제품 임계+하트비트 기록을 모두 수행한다(임계 미달 → exit 1 = 회귀 인식).
      - name: Run synthetic product check and record heartbeat
        id: check
        run: node scripts/ops-synthetic-check.mjs

      - name: Alert ops channel on synthetic check failure
        if: failure()
        run: |
          if [ -z "$OPS_ALERT_WEBHOOK_URL" ]; then
            echo "webhook not configured — alert skipped"
            exit 0
          fi
          mode="${{ steps.check.outputs.mode }}"
          deals="${{ steps.check.outputs.deals }}"
          curl -sf --max-time 15 -X POST -H 'content-type: application/json' \
            -d "{\"service\":\"sky_planner\",\"event\":\"synthetic_check_failed\",\"status\":\"fail\",\"mode\":\"$mode\",\"deals\":$deals,\"url\":\"$MAP_API_URL\"}" \
            "$OPS_ALERT_WEBHOOK_URL" \
            || echo "::warning::synthetic alert delivery failed — webhook 상태를 확인하세요"
