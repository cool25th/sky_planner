name: Daily fare batch

# 일 1회 배치 (02:00 KST = 17:00 UTC 전날). 수동 실행도 가능.
# 필요 시크릿 (하나라도 비어 있으면 설정될 때까지 건너뛴다):
#   COLLECTOR_SOURCE_MANIFEST_JSON — 수집 소스 매니페스트 (configs 예시 참조)
#   DATABASE_INGEST_URL            — 적재 계정 연결 문자열
#   SOURCE_*_FEED_API_KEY 등        — 매니페스트가 참조하는 소스별 인증 토큰
#   VERCEL_REVALIDATE_SECRET        — /api/revalidate 호출용 (Vercel env과 동일값)
on:
  schedule:
    # DATA-20260828-001 완화: GitHub 스케줄은 best-effort 지연(관측 최대 8h15m)이라
    # 슬롯 2개로 도착 기회를 늘린다. 배치는 멱등(같은 날 2회 실행 무해 — 09-01 실측).
    - cron: "30 15 * * *" # 00:30 KST
    - cron: "0 17 * * *"  # 02:00 KST
  workflow_dispatch:
  # DATA-20260828-001(B안 watchdog): batch-watchdog.yml이 last_batch 경과 20h 초과 시
  # 이 워크플로를 workflow_call로 대신 실행한다(secrets: inherit).
  workflow_call:
  # DATA-20260828-001: GitHub 스케줄 cron은 best-effort라 지연·드랍된다(2026-08-28 야간 전멸).
  # 외부 크론(cron-job.org 등)이 이 이벤트로 대신 발화할 수 있다(repo 스코프 PAT 필요):
  #   curl -X POST -H "Authorization: Bearer <PAT>" \
  #     https://api.github.com/repos/cool25th/sky_planner/dispatches \
  #     -d '{"event_type":"daily-batch"}'
  repository_dispatch:
    types: [daily-batch]

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      MANIFEST: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON }}
      INGEST_DB: ${{ secrets.DATABASE_INGEST_URL }}
      READY: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON != '' && secrets.DATABASE_INGEST_URL != '' }}
      SEED_DB: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip until secrets are configured
        if: ${{ env.READY != 'true' && env.SEED_DB == '' }}
        run: echo "collector secrets not configured yet — skipping daily batch"

      - uses: actions/checkout@v7
        if: ${{ env.READY == 'true' || env.SEED_DB != '' }}

      - uses: actions/setup-node@v7
        if: ${{ env.READY == 'true' || env.SEED_DB != '' }}
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci
        if: ${{ env.READY == 'true' || env.SEED_DB != '' }}

      # Stopgap (DATA-20260819-001): 실 collector가 구성되지 않은 동안(beta) deterministic mock read model을
      # 재게시해 batch_state 최신성(24h)을 유지한다. DATA-20260818-003이 재개되면 READY가 true가 되어 이 스텝은 자동 비활성화.
      - name: Stopgap refresh beta read model (mock republish)
        if: ${{ env.READY != 'true' && env.SEED_DB != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed

      # H3(2026-09-08 핫픽스): continue-on-error+outcome 조건으로 "첫 실패→재시도 성공=잡 성공"을 만든다.
      # run: | 안에서 인자를 다음 줄로 내려쓰면 별도 명령이 돼 인자가 유실된다 — 한 논리 명령한 줄로.
      # SOURCE_MAX_STALE_HOURS 하드코딩("24") 제거: 이 스텝 커맨드는 값을 읽지 않았고(죽은 env),
      # 남겨두면 48h 승인(Vercel env)과 해석이 갈라진다. 값 적용은 승인 큐 #2.
      - name: Run collector sources (ingest + audit failures)
        id: collect
        if: ${{ env.READY == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          COLLECTOR_SOURCE_MANIFEST_JSON: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON }}
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
          VERCEL_REVALIDATE_SECRET: ${{ secrets.VERCEL_REVALIDATE_SECRET }}
          TRAVELPAYOUTS_API_KEY: ${{ secrets.TRAVELPAYOUTS_API_KEY }}
          SOURCE_SKYSCANNER_ENABLED: "true"
          SOURCE_KOREAN_AIR_ENABLED: "true"
          SOURCE_ASIANA_ENABLED: "true"
          SOURCE_TRAVELPAYOUTS_AVIASALES_ENABLED: "true"
          SOURCE_GOOGLE_FLIGHTS_ENABLED: "false"
          SOURCE_KAYAK_ENABLED: "false"
          SOURCE_PROMO_PAGES_ENABLED: "false"
        run: |
          mkdir -p runtime
          set -o pipefail
          npm run collector:sources -- --manifest-env COLLECTOR_SOURCE_MANIFEST_JSON --ingest --audit-failure --allow-partial | tee runtime/collector-summary.json

      # DATA-20260908-001: 야간 배치 첫 전멸(09-08, 슬롯 2회 모두 미생성) 대응 — 일시 실패 1회 재시도.
      # 5분 백오프 후 동일 커맨드 재실행(배치는 멱등). 재시도 성공 시 잡은 성공, 재시도 실패 시 잡 실패.
      - name: Retry collector sources once after transient failure
        id: retry
        if: ${{ steps.collect.outcome == 'failure' && env.READY == 'true' }}
        shell: bash
        env:
          COLLECTOR_SOURCE_MANIFEST_JSON: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON }}
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
          VERCEL_REVALIDATE_SECRET: ${{ secrets.VERCEL_REVALIDATE_SECRET }}
          TRAVELPAYOUTS_API_KEY: ${{ secrets.TRAVELPAYOUTS_API_KEY }}
          SOURCE_SKYSCANNER_ENABLED: "true"
          SOURCE_KOREAN_AIR_ENABLED: "true"
          SOURCE_ASIANA_ENABLED: "true"
          SOURCE_TRAVELPAYOUTS_AVIASALES_ENABLED: "true"
          SOURCE_GOOGLE_FLIGHTS_ENABLED: "false"
          SOURCE_KAYAK_ENABLED: "false"
          SOURCE_PROMO_PAGES_ENABLED: "false"
        run: |
          sleep 300
          mkdir -p runtime
          set -o pipefail
          npm run collector:sources -- --manifest-env COLLECTOR_SOURCE_MANIFEST_JSON --ingest --audit-failure --allow-partial | tee runtime/collector-summary.json

      # RECO-20260828-001: 노선별 일별 최저가 히스토리 축적 + 30일 평균 대비 절감률 갱신.
      # H3: 수집(또는 재시도)이 성공한 뒤에만 — 쌍실패 시 스테일 캐시가 30일 평균에 오염된다.
      - name: Update price baselines and deal discounts
        if: ${{ env.READY == 'true' && (steps.collect.outcome == 'success' || steps.retry.outcome == 'success') }}
        env:
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
        run: npm run baseline:update

      # UX-20260910-005: 제휴 클릭 회수 — TP 통계 API(기존 토큰)에서 전일 sub_id별 지표를
      # affiliate_click_stats에 upsert. 실패는 경고만(스크립트가 exit 0 유지 — allow_empty 준용).
      - name: Collect affiliate click stats
        if: ${{ env.READY == 'true' }}
        env:
          TRAVELPAYOUTS_API_KEY: ${{ secrets.TRAVELPAYOUTS_API_KEY }}
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
        run: node scripts/collect-tp-click-stats.mjs

      # INT-20260829-002: "Purge old batches" 스텝 제거 — scripts/cleanup-old-batches.mjs는 Firestore 전용이라
      # 현재 Postgres 파이프라인에서 구조적 no-op였고(매번 Firebase 자격증명 실패를 || true로 흡수),
      # 작동시키면 RECO-20260828-001의 30일 baseline 히스토리와 충돌한다. Firestore publish 재개 시 설계 후 복원.

      # INT-20260823-001: 배치 직후 배포 사이트 프로브 — batch_state 갱신 후에도 사이트가
      # not_ready면 run을 실패로 만들어 무인 시간대 장애 인지 창을 ~24h에서 즉시로 줄인다.
      # H3: 수집 성공 후에만. READY가 아니면 스톱갑 경로(기존 semantics 유지).
      - name: Probe deployed source health after batch
        if: ${{ (env.READY == 'true' && (steps.collect.outcome == 'success' || steps.retry.outcome == 'success')) || (env.READY != 'true' && env.SEED_DB != '') }}
        run: |
          body=$(curl -s --max-time 30 https://skyplanner-kappa.vercel.app/api/ops/source-health)
          echo "$body" | head -c 200
          echo "$body" | grep -q '"status":"ready"'

      # 완료정의[3]: 실패-only 알림. URL 미설정 시 스크립트가 조용히 스킵한다.
      # H3: collect 실패 AND 재시도 실패(또는 미실행)일 때만 — 재시도 복구 성공은 알림 없음.
      - name: Alert ops channel on batch failure
        if: ${{ env.READY == 'true' && steps.collect.outcome == 'failure' && steps.retry.outcome != 'success' }}
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: node --experimental-strip-types scripts/ops-failure-alert.mjs --event daily_batch_failed --summary-file runtime/collector-summary.json

      # 완료정의[2]: 배치 성공의 정의는 딜–오퍼 조인 노출 가능 비율 — 미달은 부분 성공+경보.
      # H3: 성공한 요약(재시도가 덮어쓴 tee 출력 포함)만 입력으로.
      - name: Alert ops channel when deal-offer join ratio is below minimum
        if: ${{ env.READY == 'true' && (steps.collect.outcome == 'success' || steps.retry.outcome == 'success') }}
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          below=$(jq -r '.deal_join.below_threshold // false' runtime/collector-summary.json 2>/dev/null || echo false)
          if [ "$below" != "true" ]; then
            echo "deal-offer join ratio within threshold"
            exit 0
          fi
          node --experimental-strip-types scripts/ops-failure-alert.mjs \
            --event deal_join_ratio_below_min \
            --summary-file runtime/collector-summary.json
