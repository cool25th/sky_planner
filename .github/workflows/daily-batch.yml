name: Daily fare batch

# 일 1회 배치 (02:00 KST = 17:00 UTC 전날). 수동 실행도 가능.
# 필요 시크릿 (하나라도 비어 있으면 설정될 때까지 건너뛴다):
#   COLLECTOR_SOURCE_MANIFEST_JSON — 수집 소스 매니페스트 (configs 예시 참조)
#   DATABASE_INGEST_URL            — 적재 계정 연결 문자열
#   SOURCE_*_FEED_API_KEY 등        — 매니페스트가 참조하는 소스별 인증 토큰
#   VERCEL_REVALIDATE_SECRET        — /api/revalidate 호출용 (Vercel env과 동일값)
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      MANIFEST: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON }}
      INGEST_DB: ${{ secrets.DATABASE_INGEST_URL }}
      READY: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON != '' && secrets.DATABASE_INGEST_URL != '' }}
    steps:
      - name: Skip until secrets are configured
        if: ${{ env.READY != 'true' }}
        run: echo "collector secrets not configured yet — skipping daily batch"

      - uses: actions/checkout@v4
        if: ${{ env.READY == 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ env.READY == 'true' }}
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci
        if: ${{ env.READY == 'true' }}

      - name: Run collector sources (ingest + audit failures)
        if: ${{ env.READY == 'true' }}
        env:
          COLLECTOR_SOURCE_MANIFEST_JSON: ${{ secrets.COLLECTOR_SOURCE_MANIFEST_JSON }}
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
          VERCEL_REVALIDATE_SECRET: ${{ secrets.VERCEL_REVALIDATE_SECRET }}
          SOURCE_SKYSCANNER_ENABLED: "true"
          SOURCE_KOREAN_AIR_ENABLED: "true"
          SOURCE_ASIANA_ENABLED: "true"
          SOURCE_GOOGLE_FLIGHTS_ENABLED: "false"
          SOURCE_KAYAK_ENABLED: "false"
          SOURCE_PROMO_PAGES_ENABLED: "false"
          SOURCE_MAX_STALE_HOURS: "24"
        run: >
          npm run collector:sources --
          --manifest-env COLLECTOR_SOURCE_MANIFEST_JSON
          --ingest --audit-failure --allow-partial

      - name: Purge old batches (keep 2)
        if: ${{ env.READY == 'true' && (success() || failure()) }}
        env:
          DATABASE_INGEST_URL: ${{ secrets.DATABASE_INGEST_URL }}
        run: npm run cleanup:old-batches -- --keep 2 || true
