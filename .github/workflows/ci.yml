name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Node contract tests
        run: npm test

      - name: Python legacy tests
        run: python3 -m unittest discover -s tests

      # .env.local 없이 빌드되는 것이 검증된 상태여야 함(로컬에서 no-env 빌드 확인 완료)
      - name: Build
        run: npm run build
