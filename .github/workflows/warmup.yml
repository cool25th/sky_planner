name: Warmup

# PERF-20260824-001: Neon 무료 autosuspend(유휴 5분) + 서버리스 함수 콜드스타트로
# 낮 첫 방문이 5~6s 걸린다. 홈과 read-model API를 예열 방문해 콜드히트를 대신 흡수한다.
# public 저장소라 Actions 무료.
# PERF-20260831-001: 07시→05시로 확장(새벽 콜드 3.7s 실측).
# OPS-20260911-001 (2026-09-11 사용자 결정): Neon public network transfer 무료 5GB/월 소진
# 위기로 30분 주기→6시간 주기로 완화(38런/일→4런/일). 콜드스타트는 최대 ~6h 유휴 후
# 첫 방문에서 발화(3~6s) — 이그레스·CU 절감이 우선. 트래픽이 커지면 Neon 유료 또는 엣지 캐시가 정석.
on:
  schedule:
    - cron: "7 */6 * * *" # UTC 0,6,12,18 = KST 09:07·15:07·21:07·03:07 — 6시간 주기 4런/일
  workflow_dispatch:

concurrency:
  group: warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping site and read-model API
        run: |
          for url in "https://skyplanner-kappa.vercel.app/" "https://skyplanner-kappa.vercel.app/api/deals/map"; do
            seconds=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 "$url")
            echo "$url -> ${seconds}s"
          done
